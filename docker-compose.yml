services:
  mongodb:
    image: mongo:8
    container_name: riverline-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: riverline
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: riverline-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: riverline-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  pipecat:
    build:
      context: ./backend/pipecat
    container_name: riverline-pipecat
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      PIPECAT_LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
